<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="refresh" content="0; url=./" />
    <title>CampusFix - Redirecting...</title>
    <script>
      // Single Page Apps for GitHub Pages: redirect subpath to hash route
      var segmentCount = 1;
      var location = window.location;
      location.replace(
        location.protocol + '//' + location.hostname + (location.port ? ':' + location.port : '') +
        location.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?p=/' +
        location.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
        (location.search ? '&q=' + location.search.slice(1).replace(/&/g, '~and~') : '') +
        location.hash
      );
    </script>
  </head>
  <body style="font-family: sans-serif; text-align: center; padding: 50px; background: #0b1120; color: #fff;">
    <h2>Redirecting to CampusFix...</h2>
    <p>Please wait a moment while we load your dashboard.</p>
    <a href="./" style="color: #6366f1; text-decoration: underline;">Click here if not redirected</a>
  </body>
</html>
